name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (oxfmt)
        run: npm run format:check

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Dependency audit
        run: npm audit --audit-level=high

  code-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fallow health check
        run: npx fallow health --format compact
        continue-on-error: true

      - name: Fallow dead code (PR only)
        if: github.event_name == 'pull_request'
        run: npx fallow dead-code --changed-since=HEAD~1

      - name: Fallow duplication (PR only)
        if: github.event_name == 'pull_request'
        run: npx fallow dupes --changed-since=HEAD~1

  bundle-size:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Size Limit
        id: size
        run: |
          set +e
          npx size-limit --json > size-limit-report.txt 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          cat size-limit-report.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post size result to PR
        if: steps.size.outputs.result != ''
        uses: actions/github-script@v9
        with:
          script: |
            const prs = context.payload.pull_request;
            const comment = '## Bundle Size\n\n```text\n' + process.env.SIZE_RESULT + '\n```';
            if (prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs.number,
                body: comment,
              });
            }
        env:
          SIZE_RESULT: ${{ steps.size.outputs.result }}

      - name: Fail on size limit exceeded
        if: steps.size.outputs.exit_code != '0'
        run: exit 1

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests (Playwright)
        run: npx playwright test tests/smoke.spec.js --project=chromium
        env:
          CI: "true"

  spa-performance:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          npx vite preview --port 3000 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

      - name: SPA navigation performance
        run: node scripts/measure-spa-performance.mjs
        env:
          THRESHOLD_MS: "100"
